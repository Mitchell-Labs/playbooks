---
- name: Renew SSL Certificate via ACME DNS-01 (Cloudflare)
  hosts: rhel9-jump
  gather_facts: false
  become: true
  vars:
    acme_directory: "https://acme-v02.api.letsencrypt.org/directory"
    domain_name: "example.com"
    cert_path: "/etc/ssl/certs/{{ domain_name }}.crt"
    key_path: "/etc/ssl/private/{{ domain_name }}.key"
    account_key_path: "/etc/ssl/private/letsencrypt_account.key"
    csr_path: "/etc/ssl/csr/{{ domain_name }}.csr"

  tasks:
    - name: Ensure directory structure exists
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "/etc/ssl/certs"
        - "/etc/ssl/private"
        - "/etc/ssl/csr"

    - name: Generate ACME account key (if missing)
      community.crypto.openssl_privatekey:
        path: "{{ account_key_path }}"

    - name: Generate certificate private key
      community.crypto.openssl_privatekey:
        path: "{{ key_path }}"

    - name: Generate Certificate Signing Request (CSR)
      community.crypto.openssl_csr:
        path: "{{ csr_path }}"
        privatekey_path: "{{ key_path }}"
        common_name: "{{ domain_name }}"
        subject_alt_name: "DNS:{{ domain_name }},DNS:*.{{ domain_name }}"

    # STEP 1: Request the challenge
    - name: Initiate ACME DNS-01 challenge
      community.crypto.acme_certificate:
        terms_agreed: true
        acme_directory: "{{ acme_directory }}"
        acme_version: 2
        account_email: "{{ acme_email }}"
        account_key_src: "{{ account_key_path }}"
        csr: "{{ csr_path }}"
        dest: "{{ cert_path }}"
        remaining_days: 30
        challenge: dns-01
      register: acme_challenge

    # STEP 2: Fulfill the challenge (Cloudflare DNS)
    - name: Create Cloudflare DNS challenge records
      community.general.cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ item.key }}"
        type: TXT
        value: "{{ item.value[0] }}"
        api_token: "{{ cloudflare_token }}"
        state: present
        solo: true
      loop: "{{ acme_challenge.challenge_data_dns | dict2items }}"
      when: acme_challenge is changed

    # Give DNS a moment to propagate (Optional but recommended)
    - name: Wait for DNS propagation
      pause:
        seconds: 30
      when: acme_challenge is changed

    # STEP 3: Validate and retrieve certificate
    - name: Finalize ACME certificate
      community.crypto.acme_certificate:
        acme_directory: "{{ acme_directory }}"
        acme_version: 2
        account_email: "{{ acme_email }}"
        account_key_src: "{{ account_key_path }}"
        csr: "{{ csr_path }}"
        dest: "{{ cert_path }}"
        fullchain_dest: "/etc/ssl/certs/{{ domain_name }}_fullchain.crt"
        chain_dest: "/etc/ssl/certs/{{ domain_name }}_chain.crt"
        challenge: dns-01
        data: "{{ acme_challenge }}"
      when: acme_challenge is changed
      retries: 5
      delay: 30

    - name: Clean up Cloudflare DNS records
      community.general.cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ item.key }}"
        type: TXT
        api_token: "{{ cloudflare_token }}"
        state: absent
      loop: "{{ acme_challenge.challenge_data_dns | dict2items }}"
      when: acme_challenge is changed