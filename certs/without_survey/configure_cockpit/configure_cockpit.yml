---
- name: Configure Cockpit with SSL from HashiCorp Vault
  hosts: rhel9-jump
  gather_facts: false
  become: true
  vars:
    domain_name: "mikemitchell.info"
    cockpit_cert_dir: "/etc/cockpit/ws-certs.d"
    cockpit_combined_file: "{{ cockpit_cert_dir }}/{{ domain_name }}.cert"

  tasks:
    - name: Ensure required packages are present
      ansible.builtin.dnf:
        name:
          - cockpit
          - firewalld
        state: present

    - name: Retrieve certificates from HashiCorp Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_url }}"
        token: "{{ vault_token }}"
        engine_mount_point: "secret"
        path: "certificates/{{ domain_name }}"
      register: vault_certs
      #no_log: true

    - name: Create combined certificate file for Cockpit
      # We combine the cert and private_key directly from Vault into the file
      ansible.builtin.copy:
        dest: "{{ cockpit_combined_file }}"
        content: |
          {{ vault_certs.secret.certificate }}
          {{ vault_certs.secret.private_key }}
        owner: root
        group: root
        mode: '0640'
        setype: cert_t
      register: cockpit_cert_file

    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Ensure Cockpit port is open in firewalld
      ansible.posix.firewalld:
        service: cockpit
        permanent: true
        state: enabled
      notify: Reload Firewall

    - name: Restart Cockpit service if certificate changed
      ansible.builtin.systemd:
        name: cockpit
        enabled: true
        state: restarted
      when: cockpit_cert_file.changed

  handlers:
    - name: Reload Firewall
      ansible.builtin.service:
        name: firewalld
        state: reloaded